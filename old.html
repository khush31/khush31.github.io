<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khushboo Kumari — Product Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0a0b;
    --bg-2: #111114;
    --fg: #f5f5f4;
    --fg-soft: rgba(245,245,244,0.85);
    --faint: rgba(245,245,244,0.32);
    --muted: #8a8a93;
    --line: rgba(255,255,255,0.08);
    --nav-bg: rgba(15,15,18,0.72);
    --nav-border: rgba(255,255,255,0.08);
    --nav-active: rgba(255,255,255,0.08);
    --eyebrow-border: rgba(255,255,255,0.1);
    --btn-ghost-border: rgba(255,255,255,0.18);
    --dot: rgba(255,255,255,0.06);
    --pink: #ff2e63;
    --pink-2: #b5179e;
    --purple: #8b5cf6;
    --yellow: #ffb13c;
    --green: #4ade80;
    --blue: #60a5fa;
  }
  [data-theme="light"] {
    --bg: #f4f4f2;
    --bg-2: #ffffff;
    --fg: #15151a;
    --fg-soft: rgba(21,21,26,0.82);
    --faint: rgba(21,21,26,0.28);
    --muted: #6a6a76;
    --line: rgba(0,0,0,0.1);
    --nav-bg: rgba(255,255,255,0.78);
    --nav-border: rgba(0,0,0,0.08);
    --nav-active: rgba(0,0,0,0.06);
    --eyebrow-border: rgba(0,0,0,0.12);
    --btn-ghost-border: rgba(0,0,0,0.18);
    --dot: rgba(0,0,0,0.05);
    --green: #16a34a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background-color: var(--bg); color: var(--fg); font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; transition: color 0.4s ease; }
  body {
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: 0 0;
  }
  ::selection { background: var(--pink); color: #fff; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  .display { font-family: "Anton", "Archivo Black", sans-serif; font-weight: 400; letter-spacing: -0.01em; line-height: 0.92; text-transform: none; }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="app.jsx"></script>
</body>
</html>
